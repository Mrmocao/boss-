<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf" content="__CSRF_TOKEN__">
<title>作品投递工作台</title><script defer src="/portfolio.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#26364a;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #dce3eb;padding:14px max(18px,calc((100vw - 1200px)/2));display:flex;align-items:center;gap:20px}a{color:#096bb7}main{max-width:1240px;margin:auto;padding:20px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:12px 0 6px}.layout{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:16px;align-items:start}.card{background:white;padding:18px;border:1px solid #dce3eb;border-radius:6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:7px 0}input,select,textarea{display:block;width:100%;border:1px solid #bdcbd9;border-radius:4px;padding:8px;font:inherit;color:inherit}textarea{min-height:88px;resize:vertical}select{background:white}button{font:inherit;padding:6px 12px;border:1px solid #bfccda;background:#fff;color:#284358;border-radius:4px;cursor:pointer}.primary{background:#067de2;color:#fff;border-color:#067de2}button:disabled{opacity:.55;cursor:wait}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.detail{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;border-radius:4px;padding:10px}.sub,small{font-size:12px;color:#536579}.check input{display:inline;width:auto}.check{display:inline-block;margin-right:10px}#status{min-height:22px;color:#146390}details{margin:12px 0}summary{cursor:pointer}fieldset{border:0;padding:0;margin:0;min-width:0}[hidden]{display:none!important}@media(max-width:760px){.layout,.fields{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><header><a href="/">招聘后台</a><h1>作品投递工作台</h1></header>
<main><h2 id="job"></h2><div id="status" role="status" aria-live="polite">正在读取岗位…</div>
<fieldset id="controls" disabled><div class="layout"><aside class="card">
<h2>候选人</h2><label>登记记录<select id="cases"></select></label><button id="reload">刷新记录</button>
<details id="new"><summary>登记新候选人</summary><form id="create">
<label>招聘账号<input id="account" required maxlength="100" placeholder="例如 company-3"></label>
<label>候选人姓名<input id="name" required maxlength="100"></label>
<label>会话标识<input id="reference" required maxlength="120" placeholder="同一账号内唯一的会话编号或备注"></label>
<button class="primary">建立记录</button></form></details></aside>
<section class="card" id="empty">从左侧登记候选人，录入聊天或在线资料后即可初筛。</section>
<section class="card" id="detail" hidden><h2 id="title"></h2><p id="note" class="detail"></p>
<div id="source-fields"><h3>候选人资料</h3><label>聊天文字或截图转写<textarea id="chat" maxlength="6000"></textarea></label>
<div class="fields"><label>BOSS 在线资料<textarea id="profile" maxlength="6000"></textarea></label>
<label>简历文字<textarea id="resume" maxlength="6000"></textarea></label></div>
<button class="primary" id="analyze">保存资料并判定</button></div>
<details><summary>查看判定依据与资料</summary><p id="evidence" class="detail"></p></details>
<div id="draft" hidden><h3 id="step"></h3><p id="message" class="detail"></p>
<div class="actions"><button id="copy">复制话术</button><button id="sent">登记已在 BOSS 发送</button></div></div>
<div class="actions"><button id="attachment">收到附件请求</button><button id="handoff">转人工</button><button id="return">恢复原阶段</button></div>
<div id="resolve" hidden><label>人工复核结论<select id="decision"><option value="S2">符合条件，引导邮箱投递</option><option value="S3">学历或届别不符</option><option value="S4">明确专业不符</option></select></label><button id="resolve-action">登记复核并生成话术</button></div>
<div id="receipt" hidden><h3>人工核对投递邮箱</h3><label class="check"><input type="checkbox" id="has-resume">已收到简历</label>
<label class="check"><input type="checkbox" id="has-portfolio">已收到作品集</label><button id="received">登记收齐，进入待批改</button></div>
<div class="actions"><button id="review">登记人工批改完成</button><button id="close">关闭记录</button></div>
<details><summary>处理记录</summary><ol id="history"></ol></details></section></div></fieldset></main></body></html>
