# ────────────────────────────────────────────────────────────
# 十三、负责人审核｜记录谁负责、谁批准、何时批准和修改原因。
# ────────────────────────────────────────────────────────────
review:
  owner: 招聘负责人（请替换为实际姓名或职务） # 负责维护这份模板的人
  approved_by: null # 谁批准；只有真实批准后才能填写，不把生成示例算作批准
  approved_at: null # 真实批准时间，带时区
  change_note: 2026-11-03将空模板改为完整教学示例；未核验BOSS职位详情，未启用执行 # 本次修改内容与原因

# 以下是“采集结果长什么样”的教学附录，不是招聘条件，也不是真实候选人记录。
# source/confidence/status属于候选人证据，不能与上面的模板status混为一谈。
# ────────────────────────────────────────────────────────────
# 十四、候选人采集结果示例｜展示最终保存的证据结构；不是岗位要求。
# ────────────────────────────────────────────────────────────
example_candidate_observation:
  fictional: true # true表示这是一条虚构示例记录
  field_id: relevant_years # 该答案对应的采集字段
  value: 做Unity大概两年半 # 保留候选人原始表述
  normalized_value: 2.5 # 便于计算的标准化值
  unit: years # 标准化值的单位；years=年
  source: chat # 证据来源；chat=聊天，resume=简历，portfolio=作品
  evidence: 做Unity大概两年半，之前一年做的是其他开发。 # 支持该字段的原始证据文字
  source_message_local_ids: [example_message_001] # 证据来自哪些本地消息记录
  confidence: 0.95 # 提取“2.5年”的把握，不是候选人能力分，也不证明自述真实
  status: confirmed # confirmed=明确自述；inferred=推断；unknown=缺失；conflict=来源冲突
  external_verification: not_performed # 未做外部核验
